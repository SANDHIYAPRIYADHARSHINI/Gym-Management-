services:
  neo4j:
    image: neo4j:5.26-community
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-synthetic-local-password}
    volumes: ["gymgraph-data:/data"]
  neo4j-test:
    image: neo4j:5.26-community
    profiles: [test]
    ports: ["127.0.0.1:7688:7687"]
    environment:
      NEO4J_AUTH: neo4j/${TEST_NEO4J_PASSWORD:-synthetic-test-password}
volumes:
  gymgraph-data:
